[project]
name = "tinytranslator"
version = "0.1.0"
description = "Tiny Translator é um tradutor automático baseado na arquitetura de Transformer e treinado para traduzir setenças de pt -> en."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "einops>=0.8.2",
    "jaxtyping>=0.3.11",
    "marimo>=0.24.0",
    "numpy>=2.4.4",
    "tokenizers>=0.23.1",
    "torch>=2.11.0",
    "transformers>=4.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "mypy>=2.1.0",
    "ruff>=0.15.12",
    "taskipy>=1.14.1",
    "typos>=1.46.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
    "E",  
    "W",  
    "F",  
    "I",  
    "B",  
    "C4",
    "UP",  
]
extend-select = ["E501"]
extend-ignore = ["F722"]

ignore = [
    "E501",  
    "B008",  
    "C901",  
    "W191", 
    "F722", 
    "F821" 
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.taskipy.tasks]
format = "ruff format ." # Formata o código automaticamente com o Ruff
lint = "ruff check ." # Verifica erros de código e más práticas com o Ruff
typecheck = "mypy ." # Checa a tipagem estática com o Mypy
check = "task format && task lint && task typecheck" # Roda toda a bateria de testes de qualidade de uma vez
